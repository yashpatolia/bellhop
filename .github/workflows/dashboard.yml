name: dashboard

on:
  push:
    branches: [master]
  pull_request:
    paths: ["dashboard/**", "contracts/**", ".github/workflows/dashboard.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test
      - run: npm run build
