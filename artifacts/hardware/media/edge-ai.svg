<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img">
<title>What runs on the robot and what runs in the cloud</title>
<desc>On the Raspberry Pi 5: YOLO26n, YuNet and ArUco vision, Silero VAD, Moonshine speech to text, Piper voice, the eyes and games, Claude's tool runner, the triage floor and the safe-stop watchdogs. In the cloud: Deepgram Flux, Claude Sonnet, Jev for triage and tone, and Claude Haiku as Jev's backup, each with a fallback.</desc>
<rect x="6" y="6" width="888" height="458" rx="8" fill="#f7f2e7" stroke="#d8cfbd"/>
<text x="32.0" y="46.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2b2824" text-anchor="start" font-weight="400" font-style="italic" >What runs where</text>
<text x="32.0" y="70.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >Vision, driving and safety stay on the Pi. Speech and conversation use the cloud, and every cloud piece has a fallback.</text>
<rect x="24" y="92" width="590" height="352" rx="8" fill="#efe7d6"/>
<text x="40.0" y="118.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="15" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >On the robot</text>
<text x="142.0" y="118.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >Raspberry Pi 5, 2 GB</text>
<text x="40.0" y="148.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="10.5" fill="#6b6358" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.1">SEE</text>
<rect x="40" y="158" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="50.0" y="177.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >YOLO26n</text><text x="50.0" y="193.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >people, NCNN at 320 px</text>
<rect x="40" y="232" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="50.0" y="251.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >YuNet</text><text x="50.0" y="267.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >faces, and is the</text><text x="50.0" y="280.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >person facing me</text>
<rect x="40" y="306" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="50.0" y="325.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >ArUco</text><text x="50.0" y="341.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >door markers, distance</text><text x="50.0" y="354.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >from their size</text>
<text x="184.0" y="148.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="10.5" fill="#6b6358" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.1">HEAR</text>
<rect x="184" y="158" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="194.0" y="177.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Silero VAD</text><text x="194.0" y="193.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >is anyone talking,</text><text x="194.0" y="206.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >10 dB over the room</text>
<rect x="184" y="232" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="194.0" y="251.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Moonshine</text><text x="194.0" y="267.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >speech to text,</text><text x="194.0" y="280.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >offline</text>
<text x="328.0" y="148.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="10.5" fill="#6b6358" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.1">SPEAK, SHOW</text>
<rect x="328" y="158" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="338.0" y="177.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Piper</text><text x="338.0" y="193.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >the voice, Poppy</text>
<rect x="328" y="232" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="338.0" y="251.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Eyes</text><text x="338.0" y="267.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >follow the tone of</text><text x="338.0" y="280.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >each reply</text>
<rect x="328" y="306" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="338.0" y="325.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Games</text><text x="338.0" y="341.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >bingo, tic-tac-toe,</text><text x="338.0" y="354.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >memory match</text>
<text x="472.0" y="148.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="10.5" fill="#6b6358" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.1">ACT, STAY SAFE</text>
<rect x="472" y="158" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="482.0" y="177.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Tool runner</text><text x="482.0" y="193.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >drive, look, follow,</text><text x="482.0" y="206.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >games, stories, news</text>
<rect x="472" y="232" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="482.0" y="251.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Triage floor</text><text x="482.0" y="267.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >keywords, plus an</text><text x="482.0" y="280.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >optional 6.5 KB scorer</text>
<rect x="472" y="306" width="134" height="64" rx="6" fill="#fbf8f1" stroke="#d8cfbd"/><text x="482.0" y="325.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Safe stop</text><text x="482.0" y="341.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >watchdog, signals,</text><text x="482.0" y="354.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >stale vision, LED expiry</text>
<line x1="40" y1="394" x2="598" y2="394" stroke="#d8cfbd"/>
<text x="40.0" y="416.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12" fill="#2b2824" text-anchor="start" font-weight="400" font-style="normal" >Vision, driving and voice are separate processes on UDP, each restarted by systemd.</text>
<text x="40.0" y="432.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12" fill="#2b2824" text-anchor="start" font-weight="400" font-style="normal" >YOLO is exported to NCNN and torch is CPU only, so it all fits in 2 GB.</text>
<rect x="628" y="92" width="248" height="352" rx="8" fill="#e8edf2" stroke="#c5d0dc"/>
<text x="644.0" y="118.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="15" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >In the cloud</text>
<rect x="644" y="132" width="216" height="72" rx="6" fill="#f6f8fa" stroke="#c5d0dc"/><text x="654.0" y="151.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Deepgram Flux</text><text x="654.0" y="167.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >speech to text, wake word;</text><text x="654.0" y="180.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >opens only while someone talks</text><text x="654.0" y="194.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#1f7a43" text-anchor="start" font-weight="700" font-style="normal" ><tspan fill="#6b6358" font-weight="400">If down: </tspan>Moonshine after 5 s</text>
<rect x="644" y="210" width="216" height="72" rx="6" fill="#f6f8fa" stroke="#c5d0dc"/><text x="654.0" y="229.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Claude Sonnet</text><text x="654.0" y="245.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >conversation, tone, tool calls</text><text x="654.0" y="272.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#1f7a43" text-anchor="start" font-weight="700" font-style="normal" ><tspan fill="#6b6358" font-weight="400">If down: </tspan>a fixed line, then a nurse</text>
<rect x="644" y="288" width="216" height="72" rx="6" fill="#f6f8fa" stroke="#c5d0dc"/><text x="654.0" y="307.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Jev, first</text><text x="654.0" y="323.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >urgency triage and reply tone,</text><text x="654.0" y="336.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >posted alone when sure</text><text x="654.0" y="350.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#1f7a43" text-anchor="start" font-weight="700" font-style="normal" ><tspan fill="#6b6358" font-weight="400">If down: </tspan>Claude Haiku decides</text>
<rect x="644" y="366" width="216" height="72" rx="6" fill="#f6f8fa" stroke="#c5d0dc"/><text x="654.0" y="385.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >Claude Haiku, backup</text><text x="654.0" y="401.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >triage when Jev is unsure,</text><text x="654.0" y="414.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#6b6358" text-anchor="start" font-weight="400" font-style="normal" >slow or has no key</text><text x="654.0" y="428.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="11" fill="#1f7a43" text-anchor="start" font-weight="700" font-style="normal" ><tspan fill="#6b6358" font-weight="400">If down: </tspan>urgency 3, nurse soon</text>
</svg>
