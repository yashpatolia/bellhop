<circle cx="448" cy="298.9" r="5" fill="#2563c9"/>
<circle cx="496" cy="244.5" r="5" fill="#2563c9"/>
<text x="410.0" y="123.6" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12" fill="#2b2824" text-anchor="start" font-weight="400" font-style="normal" >start: x = +0.8</text>
<text x="436.0" y="184.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12" fill="#2b2824" text-anchor="start" font-weight="700" font-style="normal" >0.20 s</text>
<line x1="496" y1="252.5" x2="496" y2="338" stroke="#2563c9" stroke-width="1.2"/>
<text x="504.0" y="334.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#2563c9" text-anchor="start" font-weight="700" font-style="normal" >With halving (Bellhop): the overshoot halves the next pulse</text>
<text x="504.0" y="351.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#2563c9" text-anchor="start" font-weight="400" font-style="normal" >to 0.06 s, it lands in the band and drives forward.</text>
<text x="832.0" y="150.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#b8382f" text-anchor="end" font-weight="700" font-style="normal" >Without halving: about 0.10 s pulses jump</text>
<text x="832.0" y="167.0" font-family="'Helvetica Neue', Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#b8382f" text-anchor="end" font-weight="400" font-style="normal" >across the band forever (hunting).</text>
</svg>
