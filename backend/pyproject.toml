[project]
name = "bellhop"
version = "0.1.0"
description = "Bellhop backend: call state, dispatch, memory recall, staff alerts"
authors = [
    { name = "Aditya-Tripuraneni", email = "aditya.tripuraneni905@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "starlette>=0.46,<1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
fetch = [
    "uagents>=0.26.1",
]
claude = [
    "anthropic>=2.3.0",
]
moss = [
    "moss>=1.21.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
