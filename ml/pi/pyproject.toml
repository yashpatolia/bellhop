[project]
name = "rover"
version = "0.1.0"
description = "Bellhop robot: on-robot vision, speech, agent context and triage"
requires-python = ">=3.11,<3.12"
dependencies = [
    # numpy 1.x keeps apt's picamera2 working on the Pi; opencv 4.11 is the last that accepts it
    "numpy>=1.26,<2",
    "opencv-python==4.11.0.86",
    "ultralytics==8.4.184",
    "lap==0.5.13",
    "ncnn==1.0.20261020",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "pysilero-vad==3.4.0",
    "deepgram-sdk==7.14.0",
    "moonshine-voice==0.1.5",
    "piper-tts==1.8.0",
    "sounddevice==0.5.6",
    "anthropic==2.2.0",
    "typesafe-sdk==0.7.5",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pnnx==20260526",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

# torch on PyPI pulls CUDA packages on any Linux; the Pi needs the CPU-only wheels
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
src = ["src", "../tests", "../dev"]
cache-dir = "../.ruff_cache"  # keep pi/ to what the Pi needs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["../tests"]  # tests stay on the Mac, outside the folder sent to the Pi
addopts = "-q"
cache_dir = "../.pytest_cache"
