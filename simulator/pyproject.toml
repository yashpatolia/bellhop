[project]
name = "bellhop-simulator"
version = "0.1.0"
description = "Stand-in for the care home: residents, bell presses and the robot, fed to the Bellhop backend over its HTTP API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
bellhop-sim = "bellhop_sim.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: starts the real backend on a free port"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.build-backend]
module-name = "bellhop_sim"
